spring:
  application:
    name: ai-disciple-be
  config:
    # BE 폴더의 .env 를 그대로 읽는다. docker-compose 와 같은 파일이라 값이 한 곳에서 관리된다. (.env 는 git 에 올리지 않음)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:disciple}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:disciple}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 만 바꾼다. 엔티티와 DB 가 어긋나면 서버가 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  # 터널(Cloudflare 등) 뒤에서 IP 별 사용량 제한이 모든 요청을 한 IP 로 세지 않게 하려면 FRAMEWORK 로 둔다.
  # 포트가 터널로만 열려 있을 때만 켠다. 직접 노출된 서버에서는 X-Forwarded-For 를 위조할 수 있다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  cors:
    # 쉼표로 여러 개 지정. FE 개발 서버 주소를 기본값으로 둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # 32바이트 이상. 비어 있으면 서버가 뜨지 않는다. 바꾸면 모든 로그인이 풀린다.
    jwt-secret: ${JWT_SECRET:}
    jwt-expires-days: 7
  rate-limit:
    google-login:
      limit: 10
      window: 1m
    teaching-message:
      limit: 12
      window: 1m
    battle-create:
      limit: 5
      window: 10m
    material-upload:
      limit: 10
      window: 1h

  ai:
      # 전역 AI 동시 호출 수. 무료 티어 한도를 지키려고 서버 전체에서 이 수만큼만 동시에 부른다.
      max-concurrency: 2
      gemini:
        # 비어 있으면 서버는 뜨고, AI 를 부르는 순간 AI_UNAVAILABLE 이 난다.
        api-key: ${GEMINI_API_KEY:}
        # 모델 이름. 스모크 테스트(2026-11-04)로 확인: flash-latest 는 30초 초과가 잦아 flash-lite 로 시작한다 (D-11: Flash 계열)
        model: ${GEMINI_MODEL:gemini-flash-lite-latest}
        timeout-seconds: 30
        max-output-tokens: 2048
        # 5xx·타임아웃만 재시도. 첫 대기 1초, 이후 2배. 429 는 재시도하지 않는다.
        max-attempts: 3
        backoff-millis: 1000

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
