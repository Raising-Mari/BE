spring:
  application:
    name: ai-disciple-be
  config:
    # BE 폴더의 .env 를 그대로 읽는다. docker-compose 와 같은 파일이라 값이 한 곳에서 관리된다. (.env 는 git 에 올리지 않음)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:disciple}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:disciple}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 만 바꾼다. 엔티티와 DB 가 어긋나면 서버가 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # 쉼표로 여러 개 지정. FE 개발 서버 주소를 기본값으로 둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
