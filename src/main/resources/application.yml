spring:
  application:
    name: ai-disciple-be
  config:
    # BE 폴더의 .env 를 그대로 읽는다. docker-compose 와 같은 파일이라 값이 한 곳에서 관리된다. (.env 는 git 에 올리지 않음)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:disciple}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:disciple}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 만 바꾼다. 엔티티와 DB 가 어긋나면 서버가 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  # 터널(Cloudflare 등) 뒤에서 IP 별 사용량 제한이 모든 요청을 한 IP 로 세지 않게 하려면 FRAMEWORK 로 둔다.
  # 포트가 터널로만 열려 있을 때만 켠다. 직접 노출된 서버에서는 X-Forwarded-For 를 위조할 수 있다.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  cors:
    # 쉼표로 여러 개 지정. FE 개발 서버 주소를 기본값으로 둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # 32바이트 이상. 비어 있으면 서버가 뜨지 않는다. 바꾸면 모든 로그인이 풀린다.
    jwt-secret: ${JWT_SECRET:}
    jwt-expires-days: 7
  admin:
    # 쉼표로 구분한 Google 계정 메일. 이 메일로 가입하면 ADMIN 이 된다. 이미 가입한 계정은 바뀌지 않는다.
    emails: ${ADMIN_EMAILS:}
  rate-limit:
    google-login:
      limit: 10
      window: 1m
    teaching-message:
      limit: 12
      window: 1m
    battle-create:
      limit: 5
      window: 10m
    material-upload:
      limit: 10
      window: 1h

  ai:
      # 전역 AI 동시 호출 수. 무료 티어 한도를 지키려고 서버 전체에서 이 수만큼만 동시에 부른다.
      max-concurrency: 2
      gemini:
        # 비어 있으면 서버는 뜨고, AI 를 부르는 순간 AI_UNAVAILABLE 이 난다.
        api-key: ${GEMINI_API_KEY:}
        # 모델 이름. 스모크 테스트(2026-11-04)로 확인: flash-latest 는 30초 초과가 잦아 flash-lite 로 시작한다 (D-11: Flash 계열)
        model: ${GEMINI_MODEL:gemini-flash-lite-latest}
        timeout-seconds: 30
        max-output-tokens: 2048
        # 5xx·타임아웃만 재시도. 첫 대기 1초, 이후 2배. 429 는 재시도하지 않는다.
        max-attempts: 3
        backoff-millis: 1000
  material:
    # 붙여넣은 글의 글자 수 상한 (api-spec M-02). 넘으면 MATERIAL_TOO_LARGE.
    max-text-chars: 100000
    # PDF 에서 뽑은 글자 수 상한. 넘으면 처리 결과가 FAILED/TOO_LARGE.
    max-extracted-chars: 500000
    # PDF 쪽수 상한. 넘으면 FAILED/TOO_LARGE.
    max-pages: 500
    # 뽑은 글자(공백 제외)가 이보다 적으면 스캔본 등으로 보고 FAILED/NO_TEXT.
    min-text-chars: 30

  question:
    # 배틀에 UNJUDGED(외부 판정 전) 문항을 쓸지. 시연 직전 검수 뒤 false 로 끌 수 있다 (api-spec 11-2)
    allow-unjudged: true
    # 주차 하나에 모아 둘 목표 문항 수 (작업 한 번에 채우려는 수)
    target-count: 10
    # AI 한 번에 만들게 하는 후보 수. 출력 토큰 상한(2048)을 넘지 않게 작게 둔다.
    batch-size: 5
    # 목표를 못 채워도 이 라운드 수까지만 돈다 (라운드마다 AI 2회: 생성 + 누출 시험)
    max-rounds: 3
    # 생성 프롬프트에 넣는 자료 문장의 글자 수 상한. 라운드마다 다음 구간을 넣는다.
    prompt-sentences-max-chars: 12000

  teaching:
    # ADD 노트 검증: content 의 글자 3-gram 이 학생 메시지에 포함되는 비율의 하한 (초기값, 시연 세트로 조정)
    min-overlap: 0.6
    # 프롬프트에 넣는 최근 대화 수. 맥락이 모자라면 늘린다.
    recent-messages: 10
    # 주차당 ACTIVE 노트 상한. 유사도 >= merge-auto-threshold 로 병합되는 ADD, UPDATE, REMOVE 는 상한과 무관하다.
    max-notes-per-unit: 60
    merge-auto-threshold: 0.9
    merge-suggest-threshold: 0.75
    # 프롬프트에 넣는 현재 노트의 글자 수 상한 (최신 노트부터 채운다). 유사도 비교는 이 한도와 무관하게 전체 노트로 한다.
    prompt-notes-max-chars: 6000

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
